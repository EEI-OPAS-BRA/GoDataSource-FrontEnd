<app-list-table-v2
  #listTable
  pageTitle="LNG_PAGE_LIST_SYSTEM_UPSTREAM_SERVERS_TITLE"
  [records$]="records$"
  [processSelectedData]="processSelectedData"
  [columnActions]="tableColumnActions"
  [columns]="tableColumns"
  [breadcrumbs]="breadcrumbs"
  [quickActions]="quickActions"
  [groupActions]="groupActions"
  [addAction]="addAction"
  [groupedData]="groupedData"
  [pageCount]="pageCount"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  [pageSettingsKey]="UserSettings.SYNC_UPSTREAM_SERVERS_FIELDS"
  [sortColumn]="tableSortBy"
  [infos]="infos"
  [suffixLegends]="suffixLegends"
  [filtersApplied]="filtersApplied"
  [advancedFilterType]="undefined"
  [advancedFilters]="advancedFilters"
  (refreshData)="needsRefreshList(true)"
  (refreshDataCount)="refreshListCount()"
  (pageChange)="changePage($event)"
  (sortBy)="sortBy($event)"
  (filterBy)="filterBy($event)"
  (resetHeaderFilters)="resetFiltersToSideFilters()"
  (advancedFilterBy)="applySideFilters($event)">

  <!-- Area menu: each responsibility has its own tab -->
  <app-sync-area-tabs
    gdListTop
    area="send"
    active="servers">
  </app-sync-area-tabs>

  <!-- What each upstream server decided about the outbreaks of this instance -->
  <app-sync-upstream-access-panel
    gdListTop
    (resized)="listTable.resizeTable()">
  </app-sync-upstream-access-panel>

  <!-- What the table below is -->
  <app-sync-section-title
    gdListTop
    icon="dns"
    heading="LNG_PAGE_LIST_SYSTEM_UPSTREAM_SERVERS_TABLE_TITLE"
    description="LNG_PAGE_LIST_SYSTEM_UPSTREAM_SERVERS_TABLE_DESCRIPTION">
  </app-sync-section-title>

</app-list-table-v2>
